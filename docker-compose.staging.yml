x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-worker-image: &worker-image
  image: conf-platform-workers:latest
  build:
    context: .
    dockerfile: infrastructure/docker/workers.Dockerfile

services:
  postgres:
    image: postgres:16-alpine
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]
    environment:
      POSTGRES_DB: eventos_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    mem_limit: 1g
    cpus: "1.50"
    logging: *default-logging
    volumes:
      - staging_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eventos_db"]
      interval: 5s
      timeout: 5s
      retries: 20

  pgadmin:
    image: dpage/pgadmin4:latest
    env_file:
      - .env.staging
    environment:
      PGADMIN_CONFIG_SERVER_MODE: "True"
      PGADMIN_CONFIG_SESSION_COOKIE_NAME: "'pga4_session_staging'"
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
      PGADMIN_REPLACE_SERVERS_ON_STARTUP: "True"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:5051:80"
    volumes:
      - staging_pgadmin_data:/var/lib/pgadmin
      - ./ops/pgadmin/servers.json:/pgadmin4/servers.json:ro
    restart: unless-stopped
    mem_limit: 512m
    cpus: "0.50"
    logging: *default-logging

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    mem_limit: 512m
    cpus: "0.50"
    logging: *default-logging
    volumes:
      - staging_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  clamav:
    image: clamav/clamav:stable
    environment:
      CLAMAV_NO_FRESHCLAMD: "false"
    expose:
      - "3310"
    ports:
      - "127.0.0.1:3310:3310"
    mem_limit: 1g
    cpus: "1.00"
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 3:1 localhost:3310"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  caddy:
    image: caddy:2-alpine
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:8180:80"
      - "127.0.0.1:8443:443"
    volumes:
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - staging_caddy_data:/data
      - staging_caddy_config:/config
    restart: unless-stopped
    mem_limit: 128m
    cpus: "0.25"
    logging: *default-logging

  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - staging_prometheus_data:/prometheus
    restart: unless-stopped
    mem_limit: 512m
    cpus: "0.50"
    logging: *default-logging

  alertmanager:
    image: prom/alertmanager:v0.28.1
    env_file:
      - .env.staging
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./infrastructure/monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./ops/alertmanager-entrypoint.sh:/runtime-alertmanager-entrypoint.sh:ro
      - staging_alertmanager_data:/alertmanager
    entrypoint: ["/bin/sh", "/runtime-alertmanager-entrypoint.sh"]
    restart: unless-stopped
    mem_limit: 256m
    cpus: "0.25"
    logging: *default-logging

  backend:
    build:
      context: ./services/backend
      dockerfile: Dockerfile
    env_file:
      - .env.staging
    environment:
      DATABASE_URL_SYNC: ${RUNTIME_DATABASE_URL_SYNC:?Configure a least-privilege cloud runtime login}
      DATABASE_URL_ASYNC: ${RUNTIME_DATABASE_URL_ASYNC:?Configure the same least-privilege cloud runtime login}
      REQUIRE_RLS_SAFE_RUNTIME_ROLE: ${REQUIRE_RLS_SAFE_RUNTIME_ROLE:-false}
      MIGRATION_DATABASE_URL_SYNC: ""
      REDIS_URL: redis://redis:6379/0
      REDIS_CACHE_URL: redis://redis:6379/2
      REDIS_LOCK_URL: redis://redis:6379/3
      REDIS_OPERATION_TIMEOUT_SECONDS: 3.0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      CONF_PLATFORM_ROOT: /workspace
      S3_ENDPOINT_URL: http://cloud-minio:9000
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://127.0.0.1:9000}
      ANTIVIRUS_COMMAND: tcp://clamav:3310
      API_BASE_URL: http://127.0.0.1:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        condition: service_healthy
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8000}:8000"
    volumes:
      - .:/workspace:ro
      - ./ops:/runtime-ops:ro
      - ./services/backend/tests:/runtime-tests:ro
      - ./services/backend/tests:/app/tests:ro
    restart: unless-stopped
    mem_limit: 1g
    cpus: "1.00"
    logging: *default-logging

  workers:
    <<: *worker-image
    command: ["celery", "-A", "app.worker:celery_app", "worker", "--loglevel=INFO", "--queues=critical,default,notifications"]
    env_file:
      - .env.staging
    environment:
      DATABASE_URL_SYNC: ${RUNTIME_DATABASE_URL_SYNC:?Configure a least-privilege cloud runtime login}
      DATABASE_URL_ASYNC: ${RUNTIME_DATABASE_URL_ASYNC:?Configure the same least-privilege cloud runtime login}
      REQUIRE_RLS_SAFE_RUNTIME_ROLE: ${REQUIRE_RLS_SAFE_RUNTIME_ROLE:-false}
      MIGRATION_DATABASE_URL_SYNC: ""
      REDIS_URL: redis://redis:6379/0
      REDIS_CACHE_URL: redis://redis:6379/2
      REDIS_LOCK_URL: redis://redis:6379/3
      REDIS_OPERATION_TIMEOUT_SECONDS: 3.0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      S3_ENDPOINT_URL: http://cloud-minio:9000
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://127.0.0.1:9000}
      ANTIVIRUS_COMMAND: tcp://clamav:3310
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./ops:/runtime-ops:ro
    mem_limit: 1536m
    cpus: "1.50"
    logging: *default-logging
    healthcheck:
      disable: true

  workers-processing:
    <<: *worker-image
    command: ["celery", "-A", "app.worker:celery_app", "worker", "--loglevel=INFO", "--queues=files,videos,imports,search,reports,reconciliation"]
    env_file:
      - .env.staging
    environment:
      DATABASE_URL_SYNC: ${RUNTIME_DATABASE_URL_SYNC:?Configure a least-privilege cloud runtime login}
      DATABASE_URL_ASYNC: ${RUNTIME_DATABASE_URL_ASYNC:?Configure the same least-privilege cloud runtime login}
      REQUIRE_RLS_SAFE_RUNTIME_ROLE: ${REQUIRE_RLS_SAFE_RUNTIME_ROLE:-false}
      MIGRATION_DATABASE_URL_SYNC: ""
      REDIS_URL: redis://redis:6379/0
      REDIS_CACHE_URL: redis://redis:6379/2
      REDIS_LOCK_URL: redis://redis:6379/3
      REDIS_OPERATION_TIMEOUT_SECONDS: 3.0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      S3_ENDPOINT_URL: http://cloud-minio:9000
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://127.0.0.1:9000}
      ANTIVIRUS_COMMAND: tcp://clamav:3310
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./ops:/runtime-ops:ro
    mem_limit: 1536m
    cpus: "1.50"
    logging: *default-logging
    healthcheck:
      disable: true

  workers-legacy:
    <<: *worker-image
    command: ["celery", "-A", "workers.celery_app:app", "worker", "--loglevel=INFO", "--queues=legacy-default,legacy-files,legacy-videos,legacy-imports,legacy-search,legacy-reports,legacy-reconciliation,legacy-notifications"]
    env_file:
      - .env.staging
    environment:
      DATABASE_URL_SYNC: ${RUNTIME_DATABASE_URL_SYNC:?Configure a least-privilege cloud runtime login}
      DATABASE_URL_ASYNC: ${RUNTIME_DATABASE_URL_ASYNC:?Configure the same least-privilege cloud runtime login}
      REQUIRE_RLS_SAFE_RUNTIME_ROLE: ${REQUIRE_RLS_SAFE_RUNTIME_ROLE:-false}
      MIGRATION_DATABASE_URL_SYNC: ""
      REDIS_URL: redis://redis:6379/0
      REDIS_CACHE_URL: redis://redis:6379/2
      REDIS_LOCK_URL: redis://redis:6379/3
      REDIS_OPERATION_TIMEOUT_SECONDS: 3.0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      S3_ENDPOINT_URL: http://cloud-minio:9000
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://127.0.0.1:9000}
      ANTIVIRUS_COMMAND: tcp://clamav:3310
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 1536m
    cpus: "1.50"
    logging: *default-logging
    healthcheck:
      disable: true

volumes:
  staging_postgres_data:
  staging_pgadmin_data:
  staging_redis_data:
  staging_caddy_data:
  staging_caddy_config:
  staging_prometheus_data:
  staging_alertmanager_data:

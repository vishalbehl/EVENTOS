# Include the complete Venue Server stack, including its database, Redis,
# object storage, migrations, and API. The former root venue-server image was
# only a placeholder base image and could not run the application.
include:
  - path: services/venue/venue-server/docker-compose.yml

services:
  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile

  workers:
    build:
      context: .
      dockerfile: infrastructure/docker/workers.Dockerfile

services:
  cloud-minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_API_CORS_ALLOW_ORIGIN:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001,http://localhost:3002,http://127.0.0.1:3002,http://localhost:3003,http://127.0.0.1:3003,http://localhost:3005,http://127.0.0.1:3005}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - cloud-minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12

  cloud-minio-init:
    image: minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    depends_on:
      cloud-minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${VENUE_MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${VENUE_MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_APP_ACCESS_KEY: ${MINIO_APP_ACCESS_KEY:-confplatform-dev-app}
      MINIO_APP_SECRET_KEY: ${MINIO_APP_SECRET_KEY:-confplatform-dev-app-secret}
      S3_BUCKET_REGISTRATION_UPLOADS: ${S3_BUCKET_REGISTRATION_UPLOADS:-registration-uploads}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        mc alias set cloud http://cloud-minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc admin user add cloud "$$MINIO_APP_ACCESS_KEY" "$$MINIO_APP_SECRET_KEY" || true
        mc admin policy attach cloud readwrite --user "$$MINIO_APP_ACCESS_KEY" || true
        for bucket in presentations posters thumbnails imports assets exports event-branding quarantine "$$S3_BUCKET_REGISTRATION_UPLOADS"; do
          mc mb --ignore-existing "cloud/$$bucket"
          mc anonymous set none "cloud/$$bucket"
        done
        echo "Cloud MinIO buckets are ready."
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
    env_file:
      - services/backend/.env
    environment:
      STORAGE_MODE: s3
      S3_ENDPOINT_URL: http://cloud-minio:9000
      S3_PUBLIC_ENDPOINT_URL: http://127.0.0.1:${MINIO_API_PORT:-9000}
      S3_FORCE_PATH_STYLE: "true"
      S3_ACCESS_KEY_ID: ${MINIO_APP_ACCESS_KEY:-confplatform-dev-app}
      S3_SECRET_ACCESS_KEY: ${MINIO_APP_SECRET_KEY:-confplatform-dev-app-secret}
    depends_on:
      cloud-minio-init:
        condition: service_completed_successfully

  workers:
    image: conf-platform-workers:latest
    build:
      context: .
      dockerfile: infrastructure/docker/workers.Dockerfile
    env_file:
      - services/backend/.env
    environment:
      STORAGE_MODE: s3
      S3_ENDPOINT_URL: http://cloud-minio:9000
      S3_PUBLIC_ENDPOINT_URL: http://127.0.0.1:${MINIO_API_PORT:-9000}
      S3_FORCE_PATH_STYLE: "true"
      S3_ACCESS_KEY_ID: ${MINIO_APP_ACCESS_KEY:-confplatform-dev-app}
      S3_SECRET_ACCESS_KEY: ${MINIO_APP_SECRET_KEY:-confplatform-dev-app-secret}
    depends_on:
      cloud-minio-init:
        condition: service_completed_successfully

volumes:
  cloud-minio-data:

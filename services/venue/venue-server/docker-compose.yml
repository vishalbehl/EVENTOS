services:
  venue-db:
    # Latest supported patch in the existing PostgreSQL major line. Moving to
    # PostgreSQL 18 requires a dump/restore and is intentionally not implicit.
    image: postgres:15.19-alpine3.24
    environment:
      POSTGRES_USER: ${VENUE_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${VENUE_DB_PASSWORD:-venue_password}
      POSTGRES_DB: ${VENUE_DB_NAME:-venue_db}
    ports:
      - "5433:5432" # Expose to host on 5433 to avoid conflict if cloud DB is running locally
    volumes:
      - venue-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d venue_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  venue-redis:
    image: redis:8.10.1-alpine3.23
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  venue-minio:
    # The official MinIO Docker repository is archived; this is its newest
    # official release tag rather than an unpinned rolling `latest` tag.
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9002:9000" # Use alternate host ports when the shared platform MinIO is running
      - "9003:9001"
    volumes:
      - venue-minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  venue-api:
    build: .
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${VENUE_DB_USER:-postgres}:${VENUE_DB_PASSWORD:-venue_password}@venue-db:5432/${VENUE_DB_NAME:-venue_db}
      - REDIS_URL=redis://venue-redis:6379/0
      - MINIO_ENDPOINT=venue-minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_SECURE=False
      - LOCAL_BUCKET_NAME=venue-presentations
      - CLOUD_API_URL=http://host.docker.internal:8000 # Assuming cloud is local
      - VENUE_AUTH_KEY=${VENUE_AUTH_KEY:?VENUE_AUTH_KEY must be provisioned}
      - VENUE_AUTH_SECRET=${VENUE_AUTH_SECRET:?VENUE_AUTH_SECRET must be provisioned}
    depends_on:
      venue-db:
        condition: service_healthy
      venue-redis:
        condition: service_healthy
      venue-minio:
        condition: service_healthy
    restart: always

  venue-pgadmin:
    image: dpage/pgadmin4:9.17
    environment:
      # Development-only PgAdmin credentials. Override these in .env before
      # exposing the dashboard outside a trusted local environment.
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@eventos.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin123}
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers-config.json
      PGADMIN_REPLACE_SERVERS_ON_STARTUP: "True"
      # Server mode provides the normal PgAdmin login screen and keeps the
      # dashboard protected by the configured PgAdmin account.
      PGADMIN_CONFIG_SERVER_MODE: "True"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      # Versioned separately so a stale development auth database cannot
      # prevent the configured first-boot credentials from being applied.
      - venue-pgadmin-data-v2:/var/lib/pgadmin
      - ./pgadmin/servers-config.json:/pgadmin4/servers-config.json:ro
    depends_on:
      venue-db:
        condition: service_healthy
    restart: always

volumes:
  venue-db-data:
  venue-minio-data:
  # The previous venue-pgadmin-data volume is intentionally preserved as a
  # recoverable backup of the old PgAdmin configuration.
  venue-pgadmin-data-v2:

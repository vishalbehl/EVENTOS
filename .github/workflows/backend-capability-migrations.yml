name: Backend capability migrations

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "services/backend/alembic/**"
      - "services/backend/app/modules/billing/**"
      - "services/backend/app/modules/platform/models/**"
      - "services/backend/scripts/verify_capability_migrations.py"
      - "services/backend/tests/test_capability_migration_verifier.py"
      - "services/backend/requirements.txt"
      - ".github/workflows/backend-capability-migrations.yml"
  push:
    branches: [main]
    paths:
      - "services/backend/alembic/**"
      - "services/backend/app/modules/billing/**"
      - "services/backend/app/modules/platform/models/**"
      - "services/backend/scripts/verify_capability_migrations.py"
      - "services/backend/tests/test_capability_migration_verifier.py"
      - "services/backend/requirements.txt"
      - ".github/workflows/backend-capability-migrations.yml"

permissions:
  contents: read

concurrency:
  group: backend-capability-migrations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clean-install:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    defaults:
      run:
        working-directory: services/backend

    env:
      DATABASE_URL_SYNC: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/postgres
      DATABASE_URL_ASYNC: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/postgres
      ENVIRONMENT: test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Verify migration contract unit tests
        run: python -m pytest -q tests/test_capability_migration_verifier.py
      - name: Upgrade an empty database and inspect capability schema
        run: python scripts/verify_capability_migrations.py
      - name: Verify upgrade from the pre-capability production boundary
        run: >-
          python scripts/verify_capability_migrations.py
          --start-revision 20260722_0940

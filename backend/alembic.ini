# =============================================================
# Alembic Configuration File
# Conference Platform - Database Migration Manager
#
# Run migrations:
#   alembic upgrade head          -> apply all pending migrations
#   alembic downgrade -1          -> roll back one migration
#   alembic revision --autogenerate -m "description"  -> create new
#   alembic history               -> show migration history
#   alembic current               -> show current DB revision
# =============================================================

[alembic]
# Path to the alembic env.py script
script_location = alembic

# Template for naming new migration files
# %(year)d%(month).2d%(day).2d_%(hour).2d%(minute).2d_%(rev)s_%(slug)s
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone for file timestamps
timezone = UTC

# sys.path adjustment - add project root so app.* imports work
prepend_sys_path = .

# Max length of the slug in the filename
truncate_slug_length = 40

# Alembic output encoding
output_encoding = utf-8

# -- Database URL -------------------------------------------------
# This is overridden in env.py to read from .env
# Left here as a fallback placeholder only
sqlalchemy.url = postgresql://postgres:847425@localhost:5432/conf_platform

# -- Logging ------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
